
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HELIX Burger | Entrega del pedido</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Nuestro CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- ESTILOS COMPACTOS DE ENVÍO -->
    <style>

        /* Encabezado */
        .encabezado-envio {
            padding-top: 25px;
            padding-bottom: 15px;
        }

        .encabezado-envio h1 {
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .encabezado-envio p {
            font-size: 0.95rem;
            margin-bottom: 0;
        }

        /* Contenedor principal */
        .envio {
            max-width: 620px;
            margin: 0 auto;
        }

        .envio h2 {
            font-size: 1.35rem;
            margin-bottom: 20px !important;
        }

        /* Opciones de entrega */
        .opciones-entrega {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .opcion-entrega {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 18px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background-color: #fff;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .opcion-entrega:hover {
            border-color: #C62828;
            background-color: #fff8f5;
        }

        .opcion-entrega:has(input:checked) {
            border-color: #C62828;
            background-color: #fff3ee;
            box-shadow: 0 0 0 1px #C62828;
        }

        .opcion-entrega input {
            accent-color: #C62828;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .opcion-entrega span {
            font-size: 1rem;
            font-weight: 600;
        }

        /* Datos del cliente */
        .datos-cliente {
            margin-top: 22px !important;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 12px;
            background-color: #fff;
        }

        .datos-cliente h3 {
            font-size: 1.25rem;
            margin-bottom: 18px !important;
        }

        .datos-cliente .form-label {
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .datos-cliente .form-control {
            font-size: 0.9rem;
            padding: 9px 12px;
            border-radius: 8px;
        }

        .datos-cliente input.form-control {
            margin-bottom: 14px !important;
        }

        .datos-cliente textarea {
            resize: vertical;
            min-height: 75px;
        }

        .datos-cliente .form-control:focus {
            border-color: #C62828;
            box-shadow: 0 0 0 0.15rem rgba(198, 40, 40, 0.15);
        }

        /* Botones de navegación */
        .navegacion-envio {
            gap: 10px !important;
            margin-top: 24px !important;
            margin-bottom: 14px !important;
        }

        .navegacion-envio .btn {
            font-size: 0.88rem;
            padding: 9px 16px;
            border-radius: 8px;
        }

        /* Botón de nuevo pedido */
        .contenedor-nuevo-pedido {
            text-align: center;
            margin-bottom: 35px;
        }

        #nuevo-pedido {
            font-size: 0.78rem;
            padding: 7px 14px;
            border-radius: 8px;
            width: auto;
            display: inline-block;
        }

        /* Versión celular */
        @media (max-width: 767px) {

            .encabezado-envio {
                padding-top: 18px;
                padding-bottom: 12px;
            }

            .encabezado-envio h1 {
                font-size: 1.45rem;
            }

            .encabezado-envio p {
                font-size: 0.82rem;
            }

            .envio h2 {
                font-size: 1.15rem;
                margin-bottom: 15px !important;
            }

            .opciones-entrega {
                gap: 9px;
            }

            .opcion-entrega {
                padding: 12px;
                gap: 8px;
            }

            .opcion-entrega span {
                font-size: 0.88rem;
            }

            .datos-cliente {
                margin-top: 16px !important;
                padding: 14px;
            }

            .datos-cliente h3 {
                font-size: 1.1rem;
                margin-bottom: 14px !important;
            }

            .datos-cliente .form-label {
                font-size: 0.82rem;
            }

            .datos-cliente .form-control {
                font-size: 0.85rem;
                padding: 8px 10px;
            }

            .datos-cliente input.form-control {
                margin-bottom: 12px !important;
            }

            .navegacion-envio {
                gap: 8px !important;
                margin-top: 20px !important;
            }

            .navegacion-envio .btn {
                font-size: 0.8rem;
                padding: 8px 12px;
            }

            #nuevo-pedido {
                font-size: 0.75rem;
                padding: 6px 12px;
            }

        }

    </style>

</head>

<body>

    <!-- ENCABEZADO -->
    <header class="container text-center encabezado-envio">

        <h1>🛵 Entrega del pedido</h1>

        <p>
            ¡Ya casi terminamos! Elegí cómo recibir tu pedido.
        </p>

    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container">

        <section class="envio">

            <h2 class="text-center">
                ¿Cómo querés recibir tu pedido?
            </h2>

            <!-- OPCIONES DE ENTREGA -->
            <div class="opciones-entrega">

                <!-- RETIRO -->
                <label class="opcion-entrega">

                    <input
                        type="radio"
                        name="tipo-entrega"
                        value="Retiro por el local">

                    <span>🏪 Retiro por el local</span>

                </label>

                <!-- DELIVERY -->
                <label class="opcion-entrega">

                    <input
                        type="radio"
                        name="tipo-entrega"
                        value="Envío a domicilio">

                    <span>🛵 Envío a domicilio</span>

                </label>

            </div>

            <!-- DATOS DEL CLIENTE -->
            <div class="datos-cliente mt-4">

                <h3 class="text-center">
                    Tus datos
                </h3>

                <!-- NOMBRE -->
                <label for="nombre" class="form-label">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    class="form-control mb-3"
                    placeholder="Tu nombre"
                    autocomplete="name">

                <!-- TELÉFONO -->
                <label for="telefono" class="form-label">
                    Teléfono
                </label>

                <input
                    type="tel"
                    id="telefono"
                    class="form-control mb-3"
                    placeholder="Tu teléfono"
                    autocomplete="tel">

                <!-- DIRECCIÓN: SOLO PARA DELIVERY -->
                <div id="campo-direccion" class="d-none">

                    <label for="direccion" class="form-label">
                        Dirección de entrega
                    </label>

                    <input
                        type="text"
                        id="direccion"
                        class="form-control mb-3"
                        placeholder="Calle, número y localidad"
                        autocomplete="street-address">

                </div>

                <!-- OBSERVACIONES -->
                <label for="observaciones" class="form-label">
                    Observaciones (opcional)
                </label>

                <textarea
                    id="observaciones"
                    class="form-control"
                    rows="3"
                    placeholder="Ej: sin cebolla, tocar timbre..."></textarea>

            </div>

            <!-- BOTONES DE NAVEGACIÓN -->
            <div class="navegacion-envio d-flex justify-content-center flex-wrap">

                <a
                    href="pagos.html"
                    class="btn btn-outline-danger">
                    Volver a pagos
                </a>

                <button
                    type="button"
                    id="confirmar-pedido"
                    class="btn btn-danger">
                    Confirmar y enviar pedido
                </button>

            </div>

            <!-- NUEVO PEDIDO -->
            <div class="contenedor-nuevo-pedido">

                <button
                    type="button"
                    id="nuevo-pedido"
                    class="btn btn-outline-secondary btn-sm">
                    🔄 Nuevo pedido
                </button>

            </div>

        </section>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript de envío -->
    <script src="js/envio.js"></script>

</body>

</html>
