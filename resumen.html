
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HELIX Burger | Resumen del pedido</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Nuestro CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- ESTILOS COMPACTOS DEL RESUMEN -->
    <style>

        /* Encabezado */
        .encabezado-resumen {
            padding-top: 25px;
            padding-bottom: 15px;
        }

        .encabezado-resumen h1 {
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .encabezado-resumen p {
            font-size: 0.95rem;
            margin-bottom: 0;
        }

        /* Contenedor principal */
        .resumen {
            max-width: 680px;
            margin: 0 auto;
        }

        .resumen h2 {
            font-size: 1.35rem;
            margin-bottom: 20px !important;
        }

        /* Lista de productos */
        #lista-resumen {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }

        /* Tarjetas generadas por JavaScript */
        #lista-resumen .card {
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 0 !important;
        }

        #lista-resumen .card-body {
            padding: 12px 15px;
        }

        #lista-resumen .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        #lista-resumen .card-text {
            font-size: 0.88rem;
            line-height: 1.35;
            margin-bottom: 7px;
        }

        /* Productos individuales */
        #lista-resumen .item-resumen {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 0 !important;
        }

        #lista-resumen .item-resumen h4,
        #lista-resumen .item-resumen h5 {
            font-size: 1rem;
            margin-bottom: 6px;
        }

        #lista-resumen .item-resumen p {
            font-size: 0.88rem;
            margin-bottom: 6px;
        }

        /* Botones de cantidad y eliminar */
        #lista-resumen .btn {
            font-size: 0.8rem;
            padding: 5px 10px;
            border-radius: 7px;
        }

        #lista-resumen .btn-sm {
            font-size: 0.75rem;
            padding: 4px 9px;
        }

        /* Campos numéricos, si los hubiera */
        #lista-resumen input[type="number"] {
            max-width: 65px;
            text-align: center;
            font-size: 0.85rem;
            padding: 5px;
        }

        /* Total del pedido */
        .total-resumen {
            margin-top: 22px !important;
            margin-bottom: 22px !important;

            padding: 14px;
            border-radius: 10px;
            background-color: #fff3dc;
        }

        .total-resumen h3 {
            font-size: 1.25rem;
            margin-bottom: 0;
        }

        #total-resumen {
            color: #C62828;
            font-weight: 700;
        }

        /* Botones de navegación */
        .navegacion-resumen {
            gap: 10px !important;
            margin-bottom: 35px !important;
        }

        .navegacion-resumen .btn {
            font-size: 0.88rem;
            padding: 9px 16px;
            border-radius: 8px;
        }

        /* Versión celular */
        @media (max-width: 767px) {

            .encabezado-resumen {
                padding-top: 18px;
                padding-bottom: 12px;
            }

            .encabezado-resumen h1 {
                font-size: 1.45rem;
            }

            .encabezado-resumen p {
                font-size: 0.82rem;
            }

            .resumen {
                max-width: 100%;
            }

            .resumen h2 {
                font-size: 1.15rem;
                margin-bottom: 15px !important;
            }

            #lista-resumen {
                gap: 8px;
            }

            #lista-resumen .card-body {
                padding: 10px;
            }

            #lista-resumen .card-title {
                font-size: 0.9rem;
            }

            #lista-resumen .card-text {
                font-size: 0.8rem;
            }

            #lista-resumen .item-resumen {
                padding: 10px;
            }

            #lista-resumen .item-resumen h4,
            #lista-resumen .item-resumen h5 {
                font-size: 0.9rem;
            }

            #lista-resumen .item-resumen p {
                font-size: 0.8rem;
            }

            #lista-resumen .btn {
                font-size: 0.75rem;
                padding: 5px 8px;
            }

            .total-resumen {
                margin-top: 16px !important;
                margin-bottom: 18px !important;
                padding: 11px;
            }

            .total-resumen h3 {
                font-size: 1.1rem;
            }

            .navegacion-resumen {
                gap: 8px !important;
            }

            .navegacion-resumen .btn {
                font-size: 0.8rem;
                padding: 8px 12px;
            }

        }

    </style>

</head>

<body>

    <!-- ENCABEZADO -->
    <header class="container text-center encabezado-resumen">

        <h1>🍔 Resumen de tu pedido</h1>

        <p>Revisá tus hamburguesas antes de continuar</p>

    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container text-center">

        <section class="resumen">

            <h2 class="text-center">
                🛒 Productos seleccionados
            </h2>

            <!-- PRODUCTOS CARGADOS CON JAVASCRIPT -->
            <div id="lista-resumen">

                <!--
                    resumen.js genera los productos acá.

                    Se mantienen los controles de cantidad
                    y eliminación existentes.
                -->

            </div>

            <!-- TOTAL DEL PEDIDO -->
            <div class="total-resumen text-center">

                <h3>
                    Total:
                    <span id="total-resumen">$0</span>
                </h3>

            </div>

            <!-- BOTONES DE NAVEGACIÓN -->
            <div class="navegacion-resumen d-flex justify-content-center flex-wrap">

                <a href="menu.html"
                   class="btn btn-outline-danger">
                    Volver al menú
                </a>

                <button type="button"
                        id="continuar-pago"
                        class="btn btn-danger">
                    Continuar al pago
                </button>

            </div>

        </section>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript del resumen -->
    <script src="js/resumen.js"></script>

</body>
</html>
